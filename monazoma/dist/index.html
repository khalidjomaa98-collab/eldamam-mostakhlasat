<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08263D" />
    <title>منظومة المتابعة</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap');
      :root { --navy:#08263D; --navy-2:#0c344f; --gold:#d4a72c; --gold-light:#f4d675; --mist:#f8f5ee; --muted:#9cb0be; --red:#d62828; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; overflow:hidden; background:var(--navy); color:var(--mist); font-family:Alexandria, Tahoma, Arial, sans-serif; }
      .page { min-height:100vh; display:grid; grid-template-columns: 1.08fr .92fr; background:linear-gradient(130deg, #061d2d 0%, #0a3049 61%, #f8f5ee 61%); }
      .brand { position:relative; min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; overflow:hidden; padding:42px; }
      .brand::before { content:""; position:absolute; inset:-35%; background:repeating-radial-gradient(ellipse at center, transparent 0 55px, rgba(212,167,44,.045) 56px 57px); animation:drift 22s linear infinite; }
      .brand::after { content:""; position:absolute; width:660px; height:660px; border:1px solid rgba(244,214,117,.19); border-radius:50%; box-shadow:0 0 0 62px rgba(244,214,117,.025), 0 0 0 124px rgba(244,214,117,.018); }
      .flag { position:absolute; top:32px; right:44px; display:flex; align-items:center; gap:9px; color:#fff; background:rgba(4,25,39,.68); border:1px solid rgba(244,214,117,.38); border-radius:999px; padding:9px 13px; font-size:12px; font-weight:700; letter-spacing:.1px; box-shadow:0 8px 24px rgba(0,0,0,.16); }
      .flag i { width:8px; height:8px; background:#30b574; border-radius:50%; box-shadow:0 0 0 5px rgba(48,181,116,.13); }
      .logo-zone { position:relative; z-index:1; width:min(355px, 58vw); aspect-ratio:1; display:grid; place-items:center; }
      .orbit { position:absolute; inset:-9%; border:1px solid rgba(244,214,117,.4); border-radius:50%; animation:spin 20s linear infinite; }
      .orbit::before,.orbit::after { content:""; position:absolute; width:9px; height:9px; border-radius:50%; background:var(--gold-light); box-shadow:0 0 15px #ffe184; }
      .orbit::before { top:8%; left:21%; } .orbit::after { bottom:15%; right:8%; }
      .rays { position:absolute; inset:-30%; border-radius:50%; background:conic-gradient(from 0deg, transparent 0 40deg, rgba(244,214,117,.13) 52deg, transparent 70deg, transparent 155deg, rgba(244,214,117,.09) 170deg, transparent 185deg); animation:spin 14s linear infinite reverse; filter:blur(1px); }
      .logo { width:100%; position:relative; z-index:2; filter:drop-shadow(0 19px 24px rgba(0,0,0,.42)); animation:float 4.3s ease-in-out infinite; }
      .shine { position:absolute; z-index:3; width:105%; height:35%; top:8%; transform:rotate(-18deg); background:linear-gradient(100deg, transparent 25%, rgba(255,255,255,0) 42%, rgba(255,255,255,.48) 50%, rgba(255,255,255,0) 58%, transparent 70%); mix-blend-mode:screen; animation:sweep 4.3s ease-in-out infinite; pointer-events:none; }
      .brand-copy { position:relative; z-index:2; text-align:center; margin-top:36px; padding:17px 27px; border-radius:16px; background:linear-gradient(90deg, rgba(4,25,39,.88), rgba(4,25,39,.63)); border:1px solid rgba(244,214,117,.27); box-shadow:0 15px 34px rgba(0,0,0,.22); }
      .brand-copy h1 { margin:0 0 11px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.45); font-size:30px; font-weight:800; letter-spacing:-1px; }
      .brand-copy p { margin:0; color:#f7fbfd; text-shadow:0 1px 7px rgba(0,0,0,.45); font-size:14px; font-weight:500; line-height:1.9; }
      .login-side { display:flex; align-items:center; justify-content:center; padding:42px; background:rgba(248,245,238,.985); color:var(--navy); }
      .login { width:min(390px, 100%); animation:enter .8s cubic-bezier(.2,.8,.2,1) both; }
      .eyebrow { display:flex; align-items:center; gap:9px; color:#8a6c16; font-size:12px; font-weight:700; margin-bottom:18px; }
      .eyebrow::before { content:""; width:27px; height:2px; background:var(--gold); }
      h2 { font-size:31px; letter-spacing:-1.2px; margin:0 0 9px; font-weight:800; }
      .intro { margin:0 0 33px; color:#637783; font-size:13px; line-height:1.9; }
      label { display:block; margin:0 0 9px; font-size:12px; font-weight:700; color:#314b5b; }
      .field { margin-bottom:19px; position:relative; }
      input { width:100%; border:1px solid #d8e0e1; background:#fff; border-radius:11px; outline:none; padding:15px 46px 15px 15px; color:var(--navy); font:500 13px Alexandria, sans-serif; transition:.2s; }
      input:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(212,167,44,.13); }
      .icon { position:absolute; top:40px; right:16px; color:#8799a2; width:17px; height:17px; } .icon svg { width:17px; height:17px; display:block; }
      .row { display:flex; justify-content:space-between; align-items:center; margin:3px 0 27px; font-size:11px; }
      .remember { display:flex; gap:7px; align-items:center; color:#566d7a; } .remember input { width:14px; height:14px; accent-color:var(--gold); padding:0; }
      a { color:#927215; text-decoration:none; font-weight:700; }
      button { cursor:pointer; border:0; width:100%; padding:15px; border-radius:11px; color:#fff; background:linear-gradient(110deg, #08263d, #114766); font:700 13px Alexandria, sans-serif; box-shadow:0 12px 22px rgba(8,38,61,.18); transition:transform .2s, box-shadow .2s; }
      button:hover { transform:translateY(-2px); box-shadow:0 15px 28px rgba(8,38,61,.24); } button:active { transform:translateY(0); }
      .security { display:flex; justify-content:center; gap:8px; margin-top:23px; color:#7e919b; font-size:10px; }.lock { color:#b28c20; }
      .message.info { color:#4f6672; } button:disabled { opacity:.7; cursor:wait; transform:none; } .message { min-height:18px; margin-top:14px; text-align:center; font-size:11px; color:#a32626; }
      @keyframes float { 0%,100%{transform:translateY(0) rotate(-.5deg)} 50%{transform:translateY(-14px) rotate(.5deg)} }
      @keyframes sweep { 0%,28%{transform:translate(-85%,0) rotate(-18deg);opacity:0} 43%{opacity:1} 63%,100%{transform:translate(86%,0) rotate(-18deg);opacity:0} }
      @keyframes spin { to{transform:rotate(360deg)} } @keyframes drift { to{transform:rotate(360deg)} }
      @keyframes enter { from{opacity:0;transform:translateX(-25px)}to{opacity:1;transform:none} }
      @media(max-width:820px){ body{overflow:auto}.page{grid-template-columns:1fr; background:#f8f5ee}.brand{min-height:48vh;padding:36px 22px}.brand::after{width:400px;height:400px}.logo-zone{width:205px}.brand-copy{margin-top:20px;padding:12px 18px}.brand-copy h1{font-size:23px}.brand-copy p{font-size:11px}.login-side{padding:38px 25px 42px}.flag{top:22px;right:25px;font-size:10px;padding:7px 10px}h2{font-size:27px} }
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important} }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="brand" aria-label="هوية المنظومة">
        <div class="flag"><i></i> كتيبة 91 طرق — فرع الطرق</div>
        <div class="logo-zone">
          <div class="rays"></div><div class="orbit"></div><div class="shine"></div>
          <img class="logo" src="assets/logo.png" alt="شعار منظومة المتابعة" />
        </div>
        <div class="brand-copy"><h1>منظومة المتابعة</h1><p>متابعة مشروعات الطرق والشركات المنفذة والمستخلصات</p></div>
      </section>
      <section class="login-side">
        <form class="login" id="login-form">
          <div class="eyebrow">بوابة الدخول الآمنة</div>
          <h2>مرحباً بعودتك</h2><p class="intro">سجّل الدخول للوصول إلى لوحة المتابعة الخاصة بك.</p>
          <div class="field"><label for="user">اسم المستخدم أو البريد الإلكتروني</label><input id="user" name="user" type="text" autocomplete="username" placeholder="أدخل اسم المستخدم" required /><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></div>
          <div class="field"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required /><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span></div>
          <div class="row"><label class="remember"><input type="checkbox" id="remember" /> تذكرني</label><a href="#" id="forgot">هل نسيت كلمة المرور؟</a></div>
          <button type="submit">تسجيل الدخول ←</button><div class="message" id="message" role="status"></div>
          <div class="security">الحسابات يُنشئها مدير المنظومة</div>
        </form>
      </section>
    </main>
    <script src="assets/supabase.js"></script>
    <script src="assets/auth.js"></script>
    <script>monazoma.initLogin();</script>
  </body>
</html>
